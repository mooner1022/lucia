[package]
name = "lucia-precheck"
description = "사전 체크: 모델 없이 소스별 변화를 감지하는 모듈"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
encoding_rs = "0.8.44"
lucia-core.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "query", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
