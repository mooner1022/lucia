[workspace]
resolver = "3"
members = [
    "crates/luciad",
    "crates/lucia-core",
    "crates/lucia-runner",
    "crates/lucia-channel",
    "crates/lucia-precheck",
    "crates/lucia-store",
    "tools/fake-claude",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
lucia-core = { path = "crates/lucia-core" }
lucia-runner = { path = "crates/lucia-runner" }
lucia-channel = { path = "crates/lucia-channel" }
lucia-precheck = { path = "crates/lucia-precheck" }
lucia-store = { path = "crates/lucia-store" }
